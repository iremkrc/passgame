[project]
name = "passgame"
version = "0.1.0"
description = "Certified constraint-preserving repair benchmark for multi-turn language models"
readme = "README.md"
authors = [
    { name = "iremkrc", email = "ikaraca19@ku.edu.tr" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
