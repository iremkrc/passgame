# Copy to experiment.yaml on the pilot branch after selecting the SSH/GPU host
# and starting a compatible model server in that same execution environment.
study: ssh-open-weight-development-pilot
dataset_dir: data
split: development
tracks: [native, order]
models:
  - name: open-weight-model
    adapter: chat
    deployment: self_hosted
    model_id: SET_EXACT_SERVED_MODEL_ID
    base_url: http://127.0.0.1:8000/v1
    api_key_env: null  # Set an environment-variable name if the server requires auth.
    max_input_tokens: 32768  # Conservative bound; match the server's context capacity.
    input_price_per_million: 0
    output_price_per_million: 0
    pricing_verified_on: '2026-10-08'  # Zero API token billing; GPU accounting is separate.
    parameters:
      max_tokens: 256
      temperature: 0
    transport_retries: 2
    timeout_seconds: 180
output_dir: outputs/ssh-open-weight-development-pilot
budget_usd: 0  # API token spending only.
bootstrap_repetitions: 2000
seed: 20261008
human_audit_required_for_model_test: true
