# Prices read from the authenticated ML Cloud /model/info endpoint, 2026-10-24.
# Exact IDs confirmed by /v1/models using the experiment key.
# Compare gateway-default reasoning with a common completion cap and temperature.
study: dev-mlcloud-three-models-progressive-eight-rules-v3-20261024
dataset_dir: data/sequential-v3
split: development
tracks: [seeded]
rule_count: 8
remind_previous_rules: true
models:
  - name: qwen3.6-35b-a3b
    adapter: chat
    deployment: provider
    model_id: Qwen/Qwen3.6-35B-A3B
    base_url: https://llm.mlcloud.uni-tuebingen.de/v1
    api_key_env: TUEBINGEN_API_KEY
    max_input_tokens: 32768
    input_price_per_million: 0.14
    output_price_per_million: 1.0
    pricing_verified_on: '2026-10-24'
    parameters:
      max_tokens: 4096
      temperature: 0
    transport_retries: 2
    timeout_seconds: 180
  - name: deepseek-v4.1-flash
    adapter: chat
    deployment: provider
    model_id: deepseek-ai/DeepSeek-V4.1-Flash
    base_url: https://llm.mlcloud.uni-tuebingen.de/v1
    api_key_env: TUEBINGEN_API_KEY
    max_input_tokens: 32768
    input_price_per_million: 0.15
    output_price_per_million: 0.6
    pricing_verified_on: '2026-10-24'
    parameters:
      max_tokens: 4096
      temperature: 0
    transport_retries: 2
    timeout_seconds: 180
  - name: gemma-4-31b-it-qat-w4a16-ct
    adapter: chat
    deployment: provider
    model_id: google/gemma-4-31B-it-qat-w4a16-ct
    base_url: https://llm.mlcloud.uni-tuebingen.de/v1
    api_key_env: TUEBINGEN_API_KEY
    max_input_tokens: 32768
    input_price_per_million: 0.12
    output_price_per_million: 0.35
    pricing_verified_on: '2026-10-24'
    parameters:
      max_tokens: 4096
      temperature: 0
    transport_retries: 2
    timeout_seconds: 180
output_dir: outputs/dev-mlcloud-three-models-v3-20261024
budget_usd: 15
bootstrap_repetitions: 2000
seed: 20261008
human_audit_required_for_model_test: true
