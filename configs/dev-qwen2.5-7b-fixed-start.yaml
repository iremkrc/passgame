# Historical mixed-length pilot. Use dev-qwen2.5-7b-eight-rules.yaml for the
# current eight-rule-only design.
# Predefined initial strings, identical across models for each case.
# Initialize once; successful model outputs become the following inputs.
# Stop each conversation immediately on any rule, format, or domain failure.
study: dev-qwen2.5-7b-predefined-starts-stop-on-failure
dataset_dir: data
split: development
tracks: [fixed_start]
models:
  - name: qwen2.5-7b-instruct
    adapter: chat
    deployment: self_hosted
    model_id: qwen2.5-7b-instruct
    base_url: http://127.0.0.1:8000/v1
    api_key_env: null
    max_input_tokens: 32768
    input_price_per_million: 0
    output_price_per_million: 0
    pricing_verified_on: '2026-10-22'
    parameters:
      max_tokens: 256
      temperature: 0
    transport_retries: 2
    timeout_seconds: 180
output_dir: outputs/dev-qwen2.5-7b-predefined-starts-stop-on-failure
budget_usd: 0
bootstrap_repetitions: 2000
seed: 20261008
human_audit_required_for_model_test: true
