# Order-sensitivity v3 pilot: original, reverse and two fixed random orders
# of each of the same 24 rule sets. Same initial strings and model settings.
# Keep actual output chaining, reminders and first-failure termination.
study: dev-qwen2.5-32b-v3-order
dataset_dir: data/sequential-v3
split: development
tracks: [order]
rule_count: 8
remind_previous_rules: true
models:
  - name: qwen2.5-32b-instruct
    adapter: chat
    deployment: self_hosted
    model_id: qwen2.5-32b-instruct
    base_url: http://127.0.0.1:8000/v1
    api_key_env: null
    max_input_tokens: 32768
    input_price_per_million: 0
    output_price_per_million: 0
    pricing_verified_on: '2026-10-25'
    parameters:
      max_tokens: 256
      temperature: 0
    transport_retries: 2
    timeout_seconds: 180
output_dir: outputs/dev-qwen2.5-32b-v3-order
budget_usd: 0
bootstrap_repetitions: 2000
seed: 20261008
human_audit_required_for_model_test: true
