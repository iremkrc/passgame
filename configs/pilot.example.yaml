# Copy to experiment.yaml on a child experiment after model access is resolved.
study: development-pilot
dataset_dir: data
split: development
tracks: [controlled]
models:
  - name: provider-model
    adapter: chat
    model_id: SET_EXACT_MODEL_ID
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_input_tokens: 32768
    input_price_per_million: null  # Fill from current provider pricing.
    output_price_per_million: null
    pricing_verified_on: null
    parameters:
      max_completion_tokens: 256
      # Add temperature only when the selected model supports it.
    transport_retries: 2
    timeout_seconds: 90
output_dir: outputs/development-pilot
budget_usd: 0  # Replace with the agreed ceiling; paid work fails preflight at zero.
bootstrap_repetitions: 2000
seed: 20261008
human_audit_required_for_paid_test: true
